name: UI tests

# Runs the Electron UI specs (`npm run test:e2e`) on pull requests that touch the app or the specs.
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'assets/**', 'scripts/build.mjs', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json', 'playwright.config.ts', '.nvmrc', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: brew install tmux displayplacer
      # The runner's screen is 1024×768, smaller than Harbor's 1440×920 window, which squeezes the layout the specs
      # measure. Make it larger.
      - name: Enlarge the screen
        run: |
          displayplacer list
          id=$(displayplacer list | awk '/^Persistent screen id:/ {print $4; exit}')
          displayplacer "id:$id res:1920x1080 scaling:off" || true
          system_profiler SPDisplaysDataType | grep -i resolution
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7
